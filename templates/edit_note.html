{% extends "base.html" %}
{% block title %}Edit note — Roster Ledger{% endblock %}
{% block content %}

<a class="back-link" href="{{ url_for('notes_page') }}">&larr; Notes</a>
<h1 style="margin-bottom: 24px;">Edit note</h1>

<div class="plaque" style="max-width: 560px;">
  <form method="post" action="{{ url_for('edit_note', note_id=note.id) }}">
    <div class="note-form-grid">
      <div>
        <label class="field-label">Category</label>
        <input type="text" name="tag" list="tag-list" value="{{ note.tag }}" required class="field-input">
        <datalist id="tag-list">
          {% for t in tags %}<option value="{{ t }}">{% endfor %}
        </datalist>
      </div>
      <div>
        <label class="field-label">Date</label>
        <input type="date" name="note_date" value="{{ note.note_date }}" required class="field-input">
      </div>
    </div>
    <label class="field-label" style="margin: 16px 0 8px;">Comment</label>
    <textarea name="comment" required>{{ note.comment }}</textarea>
    <div style="display:flex; gap: 10px; margin-top: 16px;">
      <button class="btn brass" type="submit">Save changes</button>
      <a class="btn ghost" href="{{ url_for('notes_page') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
