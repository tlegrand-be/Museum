{% extends "base.html" %}
{% block title %}Edit note — Roster Ledger{% endblock %}
{% block content %}

<a class="back-link" href="{{ url_for('notes_page') }}">&larr; Notes</a>
<h1 style="margin-bottom: 24px;">Edit note</h1>

<div class="plaque" style="max-width: 560px;">
  <form method="post" action="{{ url_for('edit_note', note_id=note.id) }}">
    <div class="note-form-grid">
      <div>
        <label style="display:block; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--heading-color); margin-bottom:8px;">Category</label>
        <input type="text" name="tag" list="tag-list" value="{{ note.tag }}" required
               style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); font-family:'Inter',sans-serif; font-size:14px;">
        <datalist id="tag-list">
          {% for t in tags %}<option value="{{ t }}">{% endfor %}
        </datalist>
      </div>
      <div>
        <label style="display:block; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--heading-color); margin-bottom:8px;">Date</label>
        <input type="date" name="note_date" value="{{ note.note_date }}" required
               style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); font-family:'Inter',sans-serif; font-size:14px;">
      </div>
    </div>
    <label style="display:block; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--heading-color); margin: 16px 0 8px;">Comment</label>
    <textarea name="comment" required>{{ note.comment }}</textarea>
    <div style="display:flex; gap: 10px; margin-top: 16px;">
      <button class="btn brass" type="submit">Save changes</button>
      <a class="btn ghost" href="{{ url_for('notes_page') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
