<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roster Ledger — Locked</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div style="min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 24px;">
    <div class="plaque" style="max-width: 380px; width: 100%; padding: 40px 32px; text-align:center;">
      <div style="font-family: var(--heading-font); font-size: 22px; font-weight: 700; color: var(--heading-color); margin-bottom: 6px;">
        Roster Ledger
      </div>
      <p style="font-size: 13px; opacity: 0.7; margin-bottom: 28px;">This dashboard is private. Enter the passcode to continue.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}" style="text-align:left;">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('passcode_page') }}">
        <input type="password" name="passcode" inputmode="numeric" autofocus placeholder="Passcode"
               style="width:100%; padding:14px; text-align:center; font-size: 20px; letter-spacing: 0.3em; border:1px solid var(--line); border-radius: var(--radius); font-family: 'JetBrains Mono', monospace; margin-bottom: 18px;">
        <button class="btn brass" type="submit" style="width:100%;">Enter</button>
      </form>
    </div>
  </div>
</body>
</html>
